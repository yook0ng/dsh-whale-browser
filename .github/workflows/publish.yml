# 由 GitHub 网页触发，把包发布到 npm —— 不需要在本地装任何东西
#
# 用法（网页上点两下）：
#   1) 仓库 → Settings → Secrets and variables → Actions → New repository secret
#      名字填 NPM_TOKEN，值填你的 npm Access Token（Classic 类型里选 Automation）
#   2) 仓库 → Actions → 左侧选 Publish to npm → 右侧 Run workflow
#      或者：仓库 → Releases → Draft a new release → 打个 tag（如 v1.0.1）→ Publish release
#
# 注意：npm 不允许重复发布同一个版本号。改完代码先把 package.json 的 version 加一，
#      再用上面的方式触发发布。

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Show what will be published
        run: |
          node -e "const p=require('./package.json');console.log('包名:',p.name,'版本:',p.version,'许可:',p.license)"
          ls -1

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
